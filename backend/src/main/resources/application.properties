spring.application.name=stockpyme

# Base de datos. Los valores por defecto sirven para desarrollo con docker compose.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3310/stockpyme?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:stockpyme}
spring.datasource.password=${DB_PASSWORD:stockpyme}

# El esquema lo crea schema.sql (con sus CHECK). Hibernate no toca las tablas.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8080

# JWT. En producción hay que cambiar el secreto con la variable JWT_SECRET.
stockpyme.jwt.secreto=${JWT_SECRET:secreto-solo-para-desarrollo-cambialo-en-produccion-1234}
stockpyme.jwt.horas=12

# Carga usuarios y productos de ejemplo si la base de datos está vacía.
stockpyme.datos-demo=${DATOS_DEMO:true}

springdoc.swagger-ui.path=/swagger-ui.html
